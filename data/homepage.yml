    - title: Skill name, e.g. Level design
      logo: images/logo-placeholder.svg
      description: "What visitors see when they click this skill: where and how you
        used it, e.g. Blockouts and pacing for three puzzle levels in Unity."
experience:
  enable: false
  item:
    - title: Your role, e.g. Student Designer
