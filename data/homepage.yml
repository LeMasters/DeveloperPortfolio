      duration: Dates, e.g. Aug 2025 - Present
      logo: images/logo-placeholder.svg
awards:
  enable: false
  item:
    - title: Award or recognition, e.g. Best Use of Theme
      event: Who gave it, e.g. Global Game Jam Cincinnati
      image: images/award-placeholder.svg
hackathons:
  enable: false
  item:
    - title: Game jam name and year, e.g. Global Game Jam 2026
