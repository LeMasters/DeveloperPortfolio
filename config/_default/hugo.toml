# Technical site settings. Students don't edit this file.
# Personal details (name, description, email) are in params.yaml beside it;
# page content is edited through Pages CMS.
baseURL = "https://example.org/"   # replaced at build time by the GitHub workflow
languageCode = "en-us"
title = "Portfolio"                 # fallback only; page titles use the name in params.yaml
theme = "hugo-developer-portfolio"
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true                   # lets students paste embed code (e.g. a YouTube player) into write-ups
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    lineNos = true
    lineNumbersInTable = true
    noClasses = true
    style = "rainbow_dash"
    tabWidth = 4

# Menu. Paths have no leading slash so they work when the site lives in a
# subfolder (username.github.io/repository/). Blog and Portfolio are hidden
# automatically when they have no entries (see layouts/partials/header.html).
[[menus.main]]
  name = "About"
  url = "about/"
  weight = 1
[[menus.main]]
  name = "Portfolio"
  url = "portfolio/"
  weight = 2
[[menus.main]]
  name = "Blog"
  url = "blog/"
  weight = 3
[[menus.main]]
  name = "Contact"
  url = "contact/"
  weight = 4
